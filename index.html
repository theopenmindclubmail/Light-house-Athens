    <script>
      /* Ensure window.fetch has both getter and setter to prevent chrome extension interceptor errors */
      (function() {
        try {
          var _fetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : null;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _fetch;
            },
            set: function(fn) {
              _fetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}

        /* Intercept and suppress external extension errors */
        window.addEventListener('error', function(e) {
          if (e && (
            (e.message && e.message.indexOf('fetch of #<Window>') !== -1) ||
            (e.filename && e.filename.indexOf('chrome-extension://') !== -1)
          )) {
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            if (e.preventDefault) e.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
